[package]
name = "oasts-bench"
# The harness stays the bare `cargo run -p oasts-bench` target; the allocs
# tracker bin is invoked explicitly with `--bin allocs`.
default-run = "oasts-bench"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
description = "Corpus fetch, conformance, and benchmark harness for the oasts generator."
keywords.workspace = true
categories.workspace = true

[dependencies]
clap = { version = "=4.6.6", features = ["derive"] }
dhat = { version = "=0.3.3", optional = true }
libc = "=0.2.189"
oxc_allocator = "=0.147.0"
oxc_parser = "=0.147.0"
oxc_span = "=0.147.0"
oasts-core = { path = "../oasts-core" }
pprof = { version = "=0.15.0", default-features = false, features = ["flamegraph"], optional = true }
serde_json = { version = "=1.0.151", optional = true }
sha2 = "=0.11.0"
tempfile = "=3.27.0"
yaml-rust2 = "=0.12.0"
rayon = "=1.12.0"

[dev-dependencies]

[features]
cpu-profile = ["dep:pprof"]
heap-profile = ["dep:dhat", "dep:serde_json"]

[[bin]]
name = "oasts-cpu-profile"
path = "src/bin/cpu_profile.rs"
required-features = ["cpu-profile"]

[[bin]]
name = "oasts-heap-profile"
path = "src/bin/heap_profile.rs"
required-features = ["heap-profile"]
