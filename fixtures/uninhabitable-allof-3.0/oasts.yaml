schemaVersion: 1
input:
  path: ./openapi.yaml
output: ./generated
# Every component in this document is unreachable from an operation: the document
# exists to exercise schema-level behaviour, so pruning would leave nothing to emit.
filters:
  orphans: true
artifacts:
  types: true
  client: true
  validators: true
client:
  authEnforcement: types
  baseUrl:
    source: runtime
validation:
  engine: generated
  request: true
  response: true
  unchecked: allow
