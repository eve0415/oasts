openapi: 3.1.0
info:
  title: Int64 transform
  version: 1.0.0
paths:
  /counters/latest:
    get:
      operationId: getLatestCounter
      responses:
        '200':
          description: A counter carrying an int64.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Counter'
  /counters:
    post:
      operationId: recordCounter
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Counter'
      responses:
        '201':
          description: The recorded counter.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Counter'
  /counters/{id}:
    get:
      operationId: readCounter
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
            format: int64
        - name: cursor
          in: query
          required: true
          schema:
            type: integer
            format: int64
        - name: X-Trace
          in: header
          required: true
          schema:
            type: integer
            format: int64
      responses:
        '204':
          description: Found.
  /content:
    get:
      operationId: readContentCounter
      parameters:
        - name: filter
          in: query
          required: true
          content:
            application/json:
              schema:
                type: integer
                format: int64
      responses:
        '204':
          description: Found.
  /form:
    post:
      operationId: submitCounterForm
      requestBody:
        required: true
        content:
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/Counter'
      responses:
        '204':
          description: Submitted.
  /multipart:
    post:
      operationId: submitCounterMultipart
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/Counter'
      responses:
        '204':
          description: Submitted.
components:
  schemas:
    Counter:
      type: object
      required:
        - id
      properties:
        id:
          type: integer
          format: int64
        amount:
          type: number
