schemaVersion: 1
input:
  path: ./openapi.yaml
output: ./generated-zod
artifacts:
  types: true
  client: true
  zod: true
client:
  authEnforcement: types
  baseUrl:
    source: runtime
types:
  dateTime: date
  integer: bigint
validation:
  engine: zod
  request: true
  response: true
  unchecked: allow
