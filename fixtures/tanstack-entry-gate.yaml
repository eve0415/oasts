# SHA-256 manifest of the tanstack-artifact frozen entry-gate files; scripts/tanstack-gate.sh
# verifies it. These files were authored from the pinned descriptor and key-factory contract before
# any implementation existed and are never edited afterward — the implementation is written to
# satisfy them.
#
# What each one pins:
#
#   - the showcase document and its two configs: the path templates and response surface the key
#     factory and the eligibility rule are written against, so the emitter cannot be tuned to a
#     document that grew to fit it. The second config generates the same document under a non-string
#     date/time representation, which is the only condition under which a key must hold a value
#     different from the one the caller passed;
#   - the compile-assert cases: the generated API itself — module paths, descriptor names, the
#     structural shape an adapter's options object needs, that a query resolves the payload rather
#     than the client envelope, that the auth proof survives the wrapper, and that the three
#     query-ineligible reads export no descriptor at all;
#   - the key vectors: exact query keys and invalidation lists as data, with the input that produces
#     each one frozen alongside it. Freezing only the key would let a runner pick whatever input made
#     the emitter look right;
#   - the collision and override documents and configs: two path segments that normalize to one
#     member, generated once with the names the emitter allocates for them and once with a
#     `pathSegments` override choosing those names instead. The second config also carries an
#     override key matching no segment, which is the unmatched-override warning's reachable input.
