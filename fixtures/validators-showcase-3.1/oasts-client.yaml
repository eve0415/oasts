schemaVersion: 1
input:
  path: ./openapi.yaml
output: ./generated-client
# The frozen validator contract asserts on component schemas that no operation
# references, so this showcase opts out of unreachable-component pruning.
filters:
  orphans: true
artifacts:
  types: true
  client: true
  validators: true
client:
  authEnforcement: types
  baseUrl:
    source: runtime
validation:
  engine: generated
  request: true
  response: true
  unchecked: allow
