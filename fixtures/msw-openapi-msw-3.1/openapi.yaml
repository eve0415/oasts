openapi: 3.1.0
info:
  title: openapi-msw compatibility
  version: 1.0.0
paths:
  /pets/{petId}:
    parameters:
      - name: petId
        in: path
        required: true
        schema:
          type: integer
    get:
      parameters:
        - name: include
          in: query
          schema:
            type: string
            enum: [owner]
      responses:
        "200":
          description: Pet found.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Pet"
        "204":
          description: Pet absent.
    post:
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/NewPet"
      responses:
        "201":
          description: Pet created.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Pet"
components:
  schemas:
    NewPet:
      type: object
      required: [name]
      properties:
        name:
          type: string
    Pet:
      allOf:
        - $ref: "#/components/schemas/NewPet"
        - type: object
          required: [id]
          properties:
            id:
              type: integer
