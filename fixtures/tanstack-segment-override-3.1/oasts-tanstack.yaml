schemaVersion: 1
input:
  path: ./openapi.yaml
namespace: api
output: ./generated-tanstack
artifacts:
  types: true
  client: true
  tanstack: true
client:
  authEnforcement: types
  baseUrl:
    source: runtime
naming:
  overrides:
    pathSegments:
      # Names /foo_bar's nodes under this fragment instead of the `fooBar2` the emitter would
      # allocate. One entry names every node under the segment, because they all compose from it.
      foo_bar: fooBarUnderscore
      # Matches no segment in this document, so it warns rather than passing silently.
      not-a-segment: neverUsed
validation:
  engine: 'off'
  unchecked: allow
