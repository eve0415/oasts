# Keyword capability matrix for the validators artifact. This file is the row-coverage source
# for the conformance runner: the runner parses these rows, and asserts that every row whose
# disposition is `exact` is exercised by at least one passing and one failing conformance vector.
# disposition meanings:
#   exact      — the generated validator enforces this keyword; conformance vectors pin its verdicts.
#   annotation — recognized but never consulted at runtime; it may not change any verdict.
#   reject     — validators generation fails with a diagnostic; the keyword never reaches a validator.
# dialects records the OpenAPI line(s) in which the keyword is a recognized schema keyword.
rows:
  - keyword: type
    dialects:
      - "3.0"
      - "3.1"
    disposition: exact
    notes: Structural type check; 3.1 type arrays and 3.0 nullable both widen the accepted domain.
  - keyword: enum
    dialects:
      - "3.0"
      - "3.1"
    disposition: exact
    notes: Membership by deep JSON equality against the allowed set.
  - keyword: const
    dialects:
      - "3.1"
    disposition: exact
    notes: Deep JSON equality against a single value; 3.1 only.
  - keyword: properties
    dialects:
      - "3.0"
      - "3.1"
    disposition: exact
    notes: Each declared property value is validated in declaration order when present.
  - keyword: required
    dialects:
      - "3.0"
      - "3.1"
    disposition: exact
    notes: One issue per missing key at the object path; the key is named in the message.
  - keyword: additionalProperties
    dialects:
      - "3.0"
      - "3.1"
    disposition: exact
    notes: false rejects unknown keys; a schema validates them; the permissive default passes them through.
  - keyword: items
    dialects:
      - "3.0"
      - "3.1"
    disposition: exact
    notes: Each array element is validated against the item schema at its index.
  - keyword: prefixItems
    dialects:
      - "3.1"
    disposition: exact
    notes: Positional tuple validation; 3.1 only.
  - keyword: minLength
    dialects:
      - "3.0"
      - "3.1"
    disposition: exact
    notes: Lower bound on Unicode code-point length, not UTF-16 units.
  - keyword: maxLength
    dialects:
      - "3.0"
      - "3.1"
    disposition: exact
    notes: Upper bound on Unicode code-point length, not UTF-16 units.
  - keyword: pattern
    dialects:
      - "3.0"
      - "3.1"
    disposition: exact
    notes: Unanchored ECMA-262 partial match with no flags.
  - keyword: minimum
    dialects:
      - "3.0"
      - "3.1"
    disposition: exact
    notes: Inclusive numeric lower bound.
  - keyword: maximum
    dialects:
      - "3.0"
      - "3.1"
    disposition: exact
    notes: Inclusive numeric upper bound.
  - keyword: exclusiveMinimum
    dialects:
      - "3.0"
      - "3.1"
    disposition: exact
    notes: 3.0 boolean modifier of minimum; 3.1 numeric exclusive lower bound.
  - keyword: exclusiveMaximum
    dialects:
      - "3.0"
      - "3.1"
    disposition: exact
    notes: 3.0 boolean modifier of maximum; 3.1 numeric exclusive upper bound.
  - keyword: multipleOf
    dialects:
      - "3.0"
      - "3.1"
    disposition: exact
    notes: Exact IEEE-754 divisibility via scaled integer arithmetic, never floating modulo.
  - keyword: minItems
    dialects:
      - "3.0"
      - "3.1"
    disposition: exact
    notes: Array length lower bound.
  - keyword: maxItems
    dialects:
      - "3.0"
      - "3.1"
    disposition: exact
    notes: Array length upper bound.
  - keyword: uniqueItems
    dialects:
      - "3.0"
      - "3.1"
    disposition: exact
    notes: Pairwise deep JSON equality across elements.
  - keyword: minProperties
    dialects:
      - "3.0"
      - "3.1"
    disposition: exact
    notes: Own-property count lower bound.
  - keyword: maxProperties
    dialects:
      - "3.0"
      - "3.1"
    disposition: exact
    notes: Own-property count upper bound.
  - keyword: dependentRequired
    dialects:
      - "3.1"
    disposition: exact
    notes: A present trigger key requires its dependent keys; 3.1 only.
  - keyword: allOf
    dialects:
      - "3.0"
      - "3.1"
    disposition: exact
    notes: Every branch validates and issues aggregate at their own paths.
  - keyword: anyOf
    dialects:
      - "3.0"
      - "3.1"
    disposition: exact
    notes: Zero passing branches yields exactly one issue at the composition path.
  - keyword: oneOf
    dialects:
      - "3.0"
      - "3.1"
    disposition: exact
    notes: Exactly one passing branch; zero or more than one yields exactly one issue at the composition path.
  - keyword: "$ref"
    dialects:
      - "3.0"
      - "3.1"
    disposition: exact
    notes: Delegates to the referenced schema's validator, including recursive self-references.
  - keyword: "$dynamicRef"
    dialects:
      - "3.1"
    disposition: exact
    notes: Delegates to the statically pinned target, including recursive checks; path-dependent dynamic scope refuses validators generation with OASTS6002.
  - keyword: "$recursiveRef"
    dialects:
      - "3.1"
    disposition: exact
    notes: Delegates to the statically pinned target, including recursive checks; in an OpenAPI document with no $id, "#" is re-targeted to the nearest enclosing $recursiveAnchor because 2020-12 §9.4.2 leaves a reference from a known keyword to a known non-schema target undefined; path-dependent dynamic scope refuses validators generation with OASTS6002.
  - keyword: "format:date-time"
    dialects:
      - "3.0"
      - "3.1"
    disposition: exact
    notes: RFC 3339 date-time on string values; leap second and case-insensitive markers accepted.
  - keyword: "format:date"
    dialects:
      - "3.0"
      - "3.1"
    disposition: exact
    notes: RFC 3339 full-date on string values with real calendar validation.
  - keyword: "format:time"
    dialects:
      - "3.0"
      - "3.1"
    disposition: exact
    notes: RFC 3339 full-time on string values; a numeric or Z offset is required.
  - keyword: "format:uuid"
    dialects:
      - "3.0"
      - "3.1"
    disposition: exact
    notes: 8-4-4-4-12 hex on string values, any version, case-insensitive.
  - keyword: "format:duration"
    dialects:
      - "3.0"
      - "3.1"
    disposition: exact
    notes: RFC 3339 Appendix A duration on string values: unsigned integer components in nested order, or a bare week count; no fractional part.
  - keyword: "format:int32"
    dialects:
      - "3.0"
      - "3.1"
    disposition: exact
    notes: Integer within the signed 32-bit range, applied on integer schemas.
  - keyword: title
    dialects:
      - "3.0"
      - "3.1"
    disposition: annotation
    notes: Human-readable label; never consulted at runtime.
  - keyword: description
    dialects:
      - "3.0"
      - "3.1"
    disposition: annotation
    notes: Human-readable prose; never consulted at runtime.
  - keyword: example
    dialects:
      - "3.0"
      - "3.1"
    disposition: annotation
    notes: Illustrative value; never consulted at runtime.
  - keyword: examples
    dialects:
      - "3.1"
    disposition: annotation
    notes: Illustrative values; 3.1 schema keyword, never consulted at runtime.
  - keyword: default
    dialects:
      - "3.0"
      - "3.1"
    disposition: annotation
    notes: No default injection; assert-only validators never mutate the value.
  - keyword: deprecated
    dialects:
      - "3.0"
      - "3.1"
    disposition: annotation
    notes: Lifecycle marker; never consulted at runtime.
  - keyword: readOnly
    dialects:
      - "3.0"
      - "3.1"
    disposition: annotation
    notes: Wire-variant direction handled by the request/response type split, not by the validator.
  - keyword: writeOnly
    dialects:
      - "3.0"
      - "3.1"
    disposition: annotation
    notes: Wire-variant direction handled by the request/response type split, not by the validator.
  - keyword: contentEncoding
    dialects:
      - "3.1"
    disposition: annotation
    notes: String content annotation; never consulted at runtime.
  - keyword: contentMediaType
    dialects:
      - "3.1"
    disposition: annotation
    notes: String content annotation; never consulted at runtime.
  - keyword: contentSchema
    dialects:
      - "3.1"
    disposition: annotation
    notes: String content annotation; never consulted at runtime.
  - keyword: discriminator
    dialects:
      - "3.0"
      - "3.1"
    disposition: annotation
    notes: Never consulted at runtime; it may not alter any oneOf or anyOf verdict or issue set.
  - keyword: "format:email"
    dialects:
      - "3.0"
      - "3.1"
    disposition: exact
    notes: RFC 5321 Mailbox on string values: a dot-atom or quoted-string local part, and either an RFC 1123 host name or a bracketed IPv4/IPv6 address literal.
  - keyword: "format:uri"
    dialects:
      - "3.0"
      - "3.1"
    disposition: exact
    notes: RFC 3986 URI on string values: a scheme is required, and every component is checked against its character set with complete percent-encoded triplets.
  - keyword: "format:uri-reference"
    dialects:
      - "3.0"
      - "3.1"
    disposition: exact
    notes: RFC 3986 URI-reference on string values: a URI, or a relative reference whose first path segment carries no colon.
  - keyword: "format:hostname"
    dialects:
      - "3.0"
      - "3.1"
    disposition: exact
    notes: RFC 1123 host name on string values: dot-separated LDH labels of at most 63 characters with no hyphen at a label edge, at most 253 characters overall. IDNA validity of an xn-- label is not checked.
  - keyword: "format:ipv4"
    dialects:
      - "3.0"
      - "3.1"
    disposition: exact
    notes: RFC 2673 dotted-quad on string values: four decimal octets in 0..255, each written without a leading zero.
  - keyword: "format:ipv6"
    dialects:
      - "3.0"
      - "3.1"
    disposition: exact
    notes: RFC 4291 textual IPv6 on string values: eight hexadecimal groups with at most one :: elision, optionally ending in a dotted-quad. Zone identifiers and CIDR suffixes are not part of the address.
  - keyword: "format:int64"
    dialects:
      - "3.0"
      - "3.1"
    disposition: annotation
    notes: Not asserted; annotation only; a 64-bit integer exceeds the safe double range.
  - keyword: "format:float"
    dialects:
      - "3.0"
      - "3.1"
    disposition: annotation
    notes: Not asserted; annotation only.
  - keyword: "format:double"
    dialects:
      - "3.0"
      - "3.1"
    disposition: annotation
    notes: Not asserted; annotation only.
  - keyword: "format:byte"
    dialects:
      - "3.0"
      - "3.1"
    disposition: annotation
    notes: Not asserted; annotation only.
  - keyword: "format:binary"
    dialects:
      - "3.0"
      - "3.1"
    disposition: annotation
    notes: Not asserted; annotation only.
  - keyword: "format:password"
    dialects:
      - "3.0"
      - "3.1"
    disposition: annotation
    notes: Not asserted; annotation only.
  - keyword: xml
    dialects:
      - "3.0"
      - "3.1"
    disposition: annotation
    notes: XML serialization metadata; out of scope for JSON validation, never consulted at runtime.
  - keyword: externalDocs
    dialects:
      - "3.0"
      - "3.1"
    disposition: annotation
    notes: External documentation link; never consulted at runtime.
  - keyword: if
    dialects:
      - "3.1"
    disposition: exact
    notes: Its verdict selects then or else without becoming an issue; an incomplete condition fails validators generation with OASTS6004.
  - keyword: then
    dialects:
      - "3.1"
    disposition: exact
    notes: Applied only when a sibling if succeeds; without if it is ignored, and an incomplete active subschema fails validators generation with OASTS6004.
  - keyword: else
    dialects:
      - "3.1"
    disposition: exact
    notes: Applied only when a sibling if fails; without if it is ignored, and an incomplete active subschema fails validators generation with OASTS6004.
  - keyword: not
    dialects:
      - "3.0"
      - "3.1"
    disposition: exact
    notes: Exact negation when every declared subschema keyword emits a check; an incomplete subschema fails validators generation with OASTS6004 instead of emitting a negation.
  - keyword: dependentSchemas
    dialects:
      - "3.1"
    disposition: exact
    notes: A present trigger applies its subschema to the whole object; an incomplete subschema fails validators generation with OASTS6004.
  - keyword: unevaluatedProperties
    dialects:
      - "3.1"
    disposition: exact
    notes: Collects successful evaluated-property annotations from every supported in-place applicator and static ref at the same location; an incomplete annotation source or applied subschema fails validators generation with OASTS6004.
  - keyword: unevaluatedItems
    dialects:
      - "3.1"
    disposition: exact
    notes: Collects successful evaluated-item annotations from every supported in-place applicator and static ref at the same location; an incomplete annotation source or applied subschema fails validators generation with OASTS6004.
  - keyword: contains
    dialects:
      - "3.1"
    disposition: exact
    notes: Counts every array item that validates against the subschema; the default minimum is one, and an incomplete subschema fails validators generation with OASTS6004.
  - keyword: minContains
    dialects:
      - "3.1"
    disposition: exact
    notes: Lower bound on contains matches; zero makes contains itself always pass while leaving maxContains active.
  - keyword: maxContains
    dialects:
      - "3.1"
    disposition: exact
    notes: Upper bound on contains matches; inert without an adjacent contains keyword.
  - keyword: patternProperties
    dialects:
      - "3.1"
    disposition: exact
    notes: Every ECMA-262 Unicode regex match applies its schema, multiple matches all apply, and matched names are excluded from additionalProperties; an incomplete subschema fails with OASTS6004.
  - keyword: propertyNames
    dialects:
      - "3.1"
    disposition: exact
    notes: Each key is checked when every declared subschema keyword emits a check; an incomplete subschema fails validators generation with OASTS6004 instead of emitting propertyNames.
