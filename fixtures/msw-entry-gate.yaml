# What each one pins:
#
#   - the showcase document and its config: the request/response surface the handler factories are
#     written against, so the emitter cannot be tuned to a document that grew to fit it;
#   - the compile-assert cases: the generated API itself — module paths, factory names, the shape of
#     the resolver argument, and the `respond` correlation between match, status, contentType and
#     body. It also carries the no-payload guard pairs, which is why verify-ts.sh typechecks this
#     file twice, once with exactOptionalPropertyTypes off and once on: an optional `never` still
#     admits `undefined` when that flag is off, so a guard resting on `?: never` would pass one run
#     and fail the other, and freezing only one run would hide it;
#   - the handler-error vectors: the malformed-input error's declaration and the construction cases
#     covering every code plus both the null and non-null application-path forms.
