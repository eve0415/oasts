openapi: 3.1.0
info:
  title: Pathological Composition
  description: |
    A hand-authored OpenAPI 3.1 fixture that exercises pathological schema
    composition: deep allOf chains, wide oneOf unions, mutual and self
    recursion, combinatorial products, deep property nesting, large enums,
    cross-file reference cycles, 3.1 nullable variants, and const bounds.
  version: 1.0.0
paths:
  /deep-all-of-chain:
    get:
      summary: One allOf chain 32 levels deep.
      operationId: get-deep-all-of-chain
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DeepAllOfChainL32'
  /wide-one-of:
    get:
      summary: A oneOf union with 64 inline variants.
      operationId: get-wide-one-of
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WideOneOf'
  /mutual-recursion:
    get:
      summary: Mutually recursive tree plus a self-recursive linked node.
      operationId: get-mutual-recursion
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TreeNode'
  /combinatorial-product:
    get:
      summary: An allOf of three 4-branch oneOfs (4x4x4).
      operationId: get-combinatorial-product
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CombinatorialProduct'
  /deep-nesting:
    get:
      summary: An object whose properties nest 32 levels deep.
      operationId: get-deep-nesting
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DeepNesting'
  /big-enum:
    get:
      summary: A string enum with 256 members.
      operationId: get-big-enum
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BigEnum'
  /cross-file-refs:
    get:
      summary: Schemas split across two files with a cross-file cycle.
      operationId: get-cross-file-refs
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: './schemas/part-a.yaml#/CrossFileRoot'
  /nullable-mix:
    get:
      summary: The three 3.1 nullable spellings composed with allOf.
      operationId: get-nullable-mix
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/NullableMix'
  /const-and-bounds:
    get:
      summary: Const-valued properties at RFC 8785 numeric cutovers.
      operationId: get-const-and-bounds
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ConstAndBounds'
