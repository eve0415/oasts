openapi: 3.0.3
info:
  title: deep object encodings
  version: 1.0.0
servers:
  - url: https://api.example.test/v1
paths:
  /search:
    get:
      operationId: search
      parameters:
        - name: filter
          in: query
          style: deepObject
          explode: true
          schema:
            type: object
            properties:
              colour:
                type: string
              size:
                type: integer
      responses:
        "200":
          description: ok
          content:
            application/json:
              schema:
                type: array
                items:
                  type: string
