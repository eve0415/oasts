# SHA-256 manifest of the zod-artifact frozen entry-gate files; scripts/zod-gate.sh verifies it.
# These files were authored from the pinned zod contract before any implementation existed and are
# never edited afterward — the implementation is written to satisfy them.
#
# The keyword capability matrix is deliberately the SAME file the generated-validators engine pins,
# byte-for-byte and unedited: every validation engine shares one capability matrix, so a
# second zod-specific matrix would let the two engines drift on the very rows the dual-engine
# conformance suite exists to keep identical. Its hash therefore matches the entry in
# fixtures/validators-entry-gate.yaml.
#
# The showcase document is likewise shared, and reached through its own sibling config rather than
# a copy, so both engines are exercised against one document and can be compared pairwise.
