name: Release

# Pushing a signed `v<version>` tag publishes nine packages: the `@oasts/cli` JavaScript
# package and one `@oasts/binding-*` per target. Everything the release runs is written
# out here rather than behind a package.json script, so the whole publish path is
# reviewable in one file and a dependency cannot redefine a step of it.
on:
  push:
    tags:
      - "v*"
  # A dry run: everything up to and including `stage` runs, and the two jobs that can
  # reach npm are gated on a tag. Half the build matrix targets a platform no runner
  # here can execute, so being able to exercise all eight without spending a version
  # number is what keeps the release path honest between releases.
  workflow_dispatch:

# Never two releases at once, and never cancel one mid-flight: npm has no multi-package
# transaction, so a half-published release is superseded by a new version, never retried.
# A dry run publishes nothing, so a newer one supersedes the older answer as usual.
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: ${{ !startsWith(github.ref, 'refs/tags/') }}

permissions: {}

env:
  CARGO_TERM_COLOR: always

jobs:
  # ────────────────────────────────────────────────────────────────────────────
  # Everything downstream descends from this job, so a tag that fails any check
  # here never reaches a runner that can publish.
  plan:
    name: Validate the tag
    runs-on: ubuntu-24.04-arm
    permissions:
      contents: read
    outputs:
      version: ${{ steps.version.outputs.version }}
      npm-tag: ${{ steps.version.outputs.npm-tag }}

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # A repository ruleset decides who may create `v*`; this decides that whoever did
      # signed it. GitHub verifies the signature against the signer's registered keys,
      # so there is no key material to keep in the repo. Lightweight tags carry no
      # signature at all and are rejected outright.
      - name: Require a signed annotated tag
        if: startsWith(github.ref, 'refs/tags/')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          object=$(gh api "repos/$GITHUB_REPOSITORY/git/ref/tags/$GITHUB_REF_NAME" --jq '.object.type + " " + .object.sha')
          if [ "${object%% *}" != "tag" ]; then
            echo "::error::$GITHUB_REF_NAME is a lightweight tag. Release tags must be annotated and signed: git tag -s $GITHUB_REF_NAME -m 'release'"
            exit 1
          fi
          verified=$(gh api "repos/$GITHUB_REPOSITORY/git/tags/${object##* }" --jq '.verification.verified')
          if [ "$verified" != "true" ]; then
            echo "::error::$GITHUB_REF_NAME carries no signature GitHub can verify"
            exit 1
          fi

      # One version is written down in this repository: `[workspace.package] version` in
      # the root Cargo.toml. Every crate inherits it, the compiler stamps it into the
      # header of every file it generates, and `stage` stamps it into the nine npm
      # manifests — whose own committed `version` is never read, so releasing is one
      # edit and a tag rather than nine files that can disagree with each other.
      - name: Read the version Cargo.toml declares
        id: version
        run: |
          set -euo pipefail
          version=$(python3 -c 'import tomllib; print(tomllib.load(open("Cargo.toml", "rb"))["workspace"]["package"]["version"])')
          # Nine manifests and an npm dist-tag are about to be written from this, so
          # anything that is not recognisably a version stops the release here.
          case "$version" in
            [0-9]*.[0-9]*.[0-9]*) ;;
            *)
              echo "::error file=Cargo.toml::workspace version is not a version: '$version'"
              exit 1
              ;;
          esac
          # A prerelease must not become what `pnpm add @oasts/cli` resolves to.
          case "$version" in
            *-*) npm_tag=next ;;
            *) npm_tag=latest ;;
          esac
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "npm-tag=$npm_tag" >> "$GITHUB_OUTPUT"
          echo "releasing $version as @$npm_tag"

      # The tag names the version but is not its source, so a tag cut against the wrong
      # commit publishes nothing rather than publishing the wrong number.
      - name: The tag must name the version Cargo.toml declares
        if: startsWith(github.ref, 'refs/tags/')
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          set -euo pipefail
          if [ "$GITHUB_REF_NAME" != "v$VERSION" ]; then
            echo "::error file=Cargo.toml::tag is $GITHUB_REF_NAME, Cargo.toml declares $VERSION"
            exit 1
          fi

  # ────────────────────────────────────────────────────────────────────────────
  # One .node per target. These jobs compile third-party build scripts, so they hold
  # no credentials and no id-token: everything they produce is inert until `stage`
  # verifies it. Deliberately uncached — a release binary must not be assembled from
  # a cache any pull request could have written to.
  build:
    name: ${{ matrix.target }}
    needs:
      - plan
    runs-on: ${{ matrix.host }}
    permissions:
      contents: read

    strategy:
      fail-fast: false
      matrix:
        include:
          # Each target builds on a runner of its own architecture wherever GitHub has
          # one, which is why half of these need no cross-compilation flag at all and
          # can load what they built. The exceptions: Apple sells no x64 runner any
          # more, musl has no runner of any kind, and Rust's Windows-on-ARM story is
          # cross-from-x64 — those four are the ones nothing executes before release.
          - target: aarch64-apple-darwin
            host: macos-latest
            flags: ""
            smoke: true

          - target: x86_64-apple-darwin
            host: macos-latest
            flags: ""

          - target: aarch64-unknown-linux-gnu
            host: ubuntu-24.04-arm
            flags: ""
            smoke: true

          - target: x86_64-unknown-linux-gnu
            host: ubuntu-24.04
            flags: ""
            smoke: true

          - target: aarch64-unknown-linux-musl
            host: ubuntu-24.04-arm
            flags: --cross-compile

          - target: x86_64-unknown-linux-musl
            host: ubuntu-24.04
            flags: --cross-compile

          - target: aarch64-pc-windows-msvc
            host: windows-latest
            flags: ""

          - target: x86_64-pc-windows-msvc
            host: windows-latest
            flags: ""
            smoke: true

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # Node and pnpm versions come from devEngines in the root package.json, and the
      # action installs the workspace's dependencies itself. Its store cache stays off,
      # which is the default.
      - name: Setup pnpm and Node
        uses: pnpm/setup@c9883cc79df532ad1a7b81bf9ab944ceb090d65c # v2.0.0

      # rustup installs the rust-toolchain.toml pin on first use; the target is the
      # only thing that pin does not already name.
      - name: Add the Rust target
        run: rustup target add ${{ matrix.target }}

      # `--cross-compile` means cargo-zigbuild, and zig is the C toolchain it links musl
      # against — only the two musl legs need either. The napi CLI will `cargo install`
      # cargo-zigbuild itself when it is missing; taking the prebuilt binary instead keeps
      # one more third-party build script off a release runner.
      - name: Install cargo-zigbuild
        if: matrix.flags == '--cross-compile'
        uses: taiki-e/install-action@cb33e69fad06166ca28a42b2575e4dadabf62ee8 # v2.85.8
        with:
          tool: cargo-zigbuild

      # Cached zig would be a cache a pull request can write to, feeding a release
      # binary — the same reason nothing else in this job is cached.
      - name: Install zig
        if: matrix.flags == '--cross-compile'
        uses: mlugg/setup-zig@d1434d08867e3ee9daa34448df10607b98908d29 # v2.2.1
        with:
          version: 0.16.0
          use-cache: false

      - name: Build the binding
        working-directory: packages/oasts
        run: >
          pnpm exec napi build --platform --release --esm
          --manifest-path ../../crates/oasts-napi/Cargo.toml
          -o napi --target ${{ matrix.target }} ${{ matrix.flags }}

      # Four of the eight targets cannot run on any runner GitHub offers, so this is
      # partial by construction — but a binary that does not load at all is the failure
      # worth catching before it is published, and nothing else in the release path
      # ever executes what it built.
      - name: Load the binding
        if: matrix.smoke
        shell: bash
        run: |
          set -euo pipefail
          shopt -s nullglob
          binaries=(packages/oasts/napi/oasts.*.node)
          if [ "${#binaries[@]}" -ne 1 ]; then
            echo "::error::expected one built binding, found ${#binaries[@]}"
            exit 1
          fi
          # require() reads a bare path as a package name, so the binary is resolved to
          # an absolute one first — which is also what makes this work under Git Bash,
          # where the shell's idea of the path and node's do not agree.
          node -e '
            const { resolve } = require("node:path");
            const binding = require(resolve(process.argv[1]));
            const expected = ["discoveryCandidates", "discoverConfig", "specRefusal", "run", "watchDefaults"];
            const missing = expected.filter((name) => typeof binding[name] !== "function");
            if (missing.length > 0) throw new Error("binding is missing " + missing.join(", "));
            console.log("loaded, exports:", Object.keys(binding).join(", "));
          ' "${binaries[0]}"

      - name: Upload the binary
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: binding-${{ matrix.target }}
          path: packages/oasts/napi/oasts.*.node
          if-no-files-found: error
          retention-days: 1

      # The loader is generated alongside the binary and is identical for every target;
      # `stage` needs one copy of it to bundle the CLI, so one leg publishes it.
      - name: Upload the loader
        if: matrix.target == 'x86_64-unknown-linux-gnu'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: loader
          path: |
            packages/oasts/napi/index.js
            packages/oasts/napi/index.d.ts
          if-no-files-found: error
          retention-days: 1

  # ────────────────────────────────────────────────────────────────────────────
  # Assemble and prove the exact tree that will be published, while there is still
  # nothing on this runner that could publish it.
  stage:
    name: Stage the packages
    needs:
      - plan
      - build
    runs-on: ubuntu-24.04-arm
    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup pnpm and Node
        uses: pnpm/setup@c9883cc79df532ad1a7b81bf9ab944ceb090d65c # v2.0.0

      # tsdown bundles the generated config surface into the public entry.
      - name: Generate the config surface
        run: cargo run -p oasts-gen

      - name: Download the loader
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: loader
          path: packages/oasts/napi/

      - name: Build the JavaScript package
        run: pnpm -C packages/oasts build

      - name: Download the bindings
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: binding-*
          merge-multiple: true
          path: bindings

      # The binary's own filename carries the platform suffix that names its package
      # directory, so placement needs no lookup table to drift out of date. Both
      # directions are an error: a built target with no package, and a package with
      # no built target.
      - name: Place each binary in its package
        run: |
          set -euo pipefail
          for binary in bindings/oasts.*.node; do
            suffix=$(basename "$binary" .node)
            suffix=${suffix#oasts.}
            if [ ! -d "packages/oasts/npm/$suffix" ]; then
              echo "::error::built $suffix, but packages/oasts/npm/$suffix does not exist"
              exit 1
            fi
            mv "$binary" "packages/oasts/npm/$suffix/oasts.$suffix.node"
          done
          for directory in packages/oasts/npm/*/; do
            suffix=$(basename "$directory")
            if [ ! -f "$directory/oasts.$suffix.node" ]; then
              echo "::error::packages/oasts/npm/$suffix has no binary; the build matrix does not cover it"
              exit 1
            fi
          done

      # npm auto-includes README and LICENSE only from the package directory, and this
      # repository keeps one copy of each at its root.
      - name: Copy the README and LICENSE into the package
        run: cp README.md LICENSE packages/oasts/

      # Whatever version the nine manifests carry in git is overwritten here, from
      # Cargo.toml by way of `plan` — nothing reads the committed value, so it is left
      # wherever it last landed rather than maintained. The dependency map is derived
      # from the package directories rather than restated, so `napi.targets` stays the
      # one place the platform list is written down.
      - name: Stamp the version and point the package at its bindings
        env:
          VERSION: ${{ needs.plan.outputs.version }}
        run: |
          set -euo pipefail
          for manifest in packages/oasts/npm/*/package.json; do
            jq --arg version "$VERSION" '.version = $version' "$manifest" >"$manifest.next"
            mv "$manifest.next" "$manifest"
          done
          bindings=$(jq -r .name packages/oasts/npm/*/package.json |
            jq -R . | jq -s --arg version "$VERSION" 'map({key: ., value: $version}) | from_entries')
          jq --argjson bindings "$bindings" --arg version "$VERSION" \
            '.version = $version | .optionalDependencies = $bindings' \
            packages/oasts/package.json >packages/oasts/package.json.next
          mv packages/oasts/package.json.next packages/oasts/package.json
          jq '{version, optionalDependencies}' packages/oasts/package.json

      # The .node next to dist/cli.js is a local development convenience. Shipping it
      # would put a platform binary inside the platform-independent package, which no
      # test would notice — hence an explicit assertion on the packed bytes.
      - name: The tarball must carry the docs and no binary
        working-directory: packages/oasts
        run: |
          set -euo pipefail
          pnpm pack --pack-destination "$RUNNER_TEMP" >/dev/null
          contents=$(tar tzf "$RUNNER_TEMP"/oasts-*.tgz)
          echo "$contents"
          for required in package/README.md package/LICENSE package/dist/cli.js package/dist/index.js package/dist/index.d.ts; do
            grep -qxF "$required" <<<"$contents" || { echo "::error::$required missing from the tarball"; exit 1; }
          done
          if grep -q '\.node$' <<<"$contents"; then
            echo "::error::a native binary reached the platform-independent tarball"
            exit 1
          fi

      - name: Upload the staged packages
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: release
          path: |
            packages/oasts/dist
            packages/oasts/npm
            packages/oasts/package.json
            packages/oasts/README.md
            packages/oasts/LICENSE
          if-no-files-found: error
          retention-days: 7

  # ────────────────────────────────────────────────────────────────────────────
  # The only job that can publish. It installs no dependencies, checks out no source,
  # and runs no lifecycle scripts — the staged tree is already final, so nothing
  # third-party executes on the runner holding the OIDC token.
  #
  # Authentication is npm trusted publishing: the `id-token` below is exchanged for a
  # short-lived, workflow-scoped credential, and provenance is signed from the same
  # identity. There is deliberately no NPM_TOKEN — pnpm falls back off OIDC the moment
  # a static token is configured, so setting one would silently downgrade this.
  publish:
    name: Publish to npm
    needs:
      - plan
      - stage
    # A dry run stops here: everything above it has already proven the tree, and nothing
    # below it should run without a signed tag behind it. The event is half the condition
    # because a dispatch can name a tag as its ref — releasing stays the one thing only a
    # tag *push* does, rather than becoming something a button can also do.
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-24.04-arm
    environment: release
    permissions:
      id-token: write

    steps:
      # Nothing is checked out here, so the versions devEngines would supply are given
      # directly, and there is no workspace to install.
      - name: Setup pnpm and Node
        uses: pnpm/setup@c9883cc79df532ad1a7b81bf9ab944ceb090d65c # v2.0.0
        with:
          version: 11.18.0
          runtime: node@24.18.1
          install: false

      - name: Download the staged packages
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: release
          # upload-artifact roots an artifact at the least common ancestor of the paths
          # it was given, so `stage` produced a tree rooted at packages/oasts.
          path: packages/oasts

      # Artifact upload does not preserve the executable bit, and the published bin
      # should carry it even though npm sets it on install.
      - name: Restore the executable bit
        run: chmod +x packages/oasts/dist/cli.js

      # Dependency order: the JavaScript package must never reach the registry naming
      # a binding that is not there yet.
      - name: Publish the platform packages
        env:
          NPM_TAG: ${{ needs.plan.outputs.npm-tag }}
        run: |
          set -euo pipefail
          for directory in packages/oasts/npm/*/; do
            echo "::group::$(jq -r .name "$directory/package.json")"
            pnpm publish "$directory" --tag "$NPM_TAG" --access public --provenance --no-git-checks --ignore-scripts
            echo "::endgroup::"
          done

      - name: Publish @oasts/cli
        env:
          NPM_TAG: ${{ needs.plan.outputs.npm-tag }}
        run: pnpm publish packages/oasts --tag "$NPM_TAG" --access public --provenance --no-git-checks --ignore-scripts

  # ────────────────────────────────────────────────────────────────────────────
  # After npm, not before: a GitHub release announcing a version that failed to reach
  # the registry is worse than the reverse. The platform binaries are attached because
  # they are the artifacts CI actually built — the npm tarballs are already immutable
  # on the registry and are not duplicated here.
  #
  # Those attached binaries are the one thing this release produces that npm's own
  # provenance does not cover, so they get an attestation of their own. Like `publish`,
  # this job checks out nothing and installs nothing, which is what makes an id-token
  # here cheap: there is no third-party code on the runner to misuse it.
  playground:
    name: Publish the browser compiler
    needs:
      - plan
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/')
    # Shared with CI's `main` publish, whose workflow-level group is a different one: both
    # rewrite the archive's single index object, and `git push --follow-tags` starts them at
    # once. Queue rather than cancel, so this still publishes after the `main` build.
    concurrency:
      group: playground-archive
      cancel-in-progress: false
    runs-on: ubuntu-24.04-arm
    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup pnpm and Node
        uses: pnpm/setup@c9883cc79df532ad1a7b81bf9ab944ceb090d65c # v2.0.0
        with:
          cache: true

      # What this job builds gets published, so it must not restore cache state a pull
      # request could have written. Lookup-only checks the key without downloading it.
      - name: Cache Rust build
        uses: Swatinem/rust-cache@c19371144df3bb44fab255c43d04cbc2ab54d1c4 # v2.9.1
        with:
          lookup-only: true

      # wrangler is the site workspace's dependency, and the publish runs through it.
      - name: Install
        working-directory: www
        run: pnpm install --frozen-lockfile

      # The site ships no compiler; the playground reads every version from this archive, so a
      # release reaches it without the docs being rebuilt or redeployed.
      # --remote is the opt-in that lets anything reach the shared archive; without it the
      # script only seeds a local bucket.
      - name: Publish the browser compiler to the archive
        run: scripts/playground-wasm.sh --remote
        env:
          # The version `plan` validated against the tag, rather than one re-read from the
          # checkout, so the archive can never label a build with a version the tag disowns.
          PLAYGROUND_LABEL: ${{ needs.plan.outputs.version }}
          # A release is the only thing that claims the playground's default version.
          PLAYGROUND_CURRENT: "1"
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

  github-release:
    name: Publish the GitHub release
    needs:
      - plan
      - publish
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-24.04-arm
    permissions:
      contents: write
      # actions/attest needs all three: id-token to mint the OIDC token Sigstore signs
      # against, attestations to persist the result, artifact-metadata for the storage
      # record it writes alongside.
      id-token: write
      attestations: write
      artifact-metadata: write

    steps:
      - name: Download the staged packages
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: release
          # upload-artifact roots an artifact at the least common ancestor of the paths
          # it was given, so `stage` produced a tree rooted at packages/oasts.
          path: packages/oasts

      - name: Attest the platform binaries
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-path: packages/oasts/npm/*/oasts.*.node

      - name: Create the release
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ needs.plan.outputs.version }}
        run: |
          set -euo pipefail
          prerelease=()
          case "$VERSION" in
            *-*) prerelease=(--prerelease) ;;
          esac
          gh release create "$GITHUB_REF_NAME" \
            --repo "$GITHUB_REPOSITORY" \
            --title "v$VERSION" \
            --verify-tag \
            --generate-notes \
            "${prerelease[@]}" \
            packages/oasts/npm/*/oasts.*.node
