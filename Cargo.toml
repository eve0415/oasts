[workspace]
resolver = "3"
members = ["crates/oasts-core", "crates/oasts", "crates/oasts-fetch", "crates/oasts-napi", "crates/oasts-wasm", "crates/oasts-gen", "crates/oasts-bench"]

[workspace.package]
version = "0.0.5"
edition = "2024"
rust-version = "1.97"
license = "MIT"
repository = "https://github.com/eve0415/oasts"
homepage = "https://github.com/eve0415/oasts"
description = "OpenAPI-to-TypeScript compiler with fully typed errors, compile-time auth checks, and a zero-dependency fetch client — plus first-party Zod, TanStack Query, and MSW artifacts."
keywords = ["openapi", "typescript", "codegen", "compiler"]
categories = ["command-line-utilities", "development-tools"]

[profile.release]
codegen-units = 1
lto = "fat"
strip = "symbols"

# The browser artifact is a CDN asset, so it optimises for size where the CLI optimises for speed.
[profile.wasm]
inherits = "release"
opt-level = "z"

# Release-equivalent code generation with symbols retained for the feature-gated
# oasts-bench CPU and heap profilers.
[profile.profiling]
inherits = "release"
debug = 1
strip = "none"
