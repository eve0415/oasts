[workspace]
resolver = "3"
members = ["crates/oasts-core", "crates/oasts", "crates/oasts-napi", "crates/oasts-gen"]

[workspace.package]
version = "0.0.0"
edition = "2024"
rust-version = "1.97"
license = "MIT"
repository = "https://github.com/eve0415/oasts"
homepage = "https://github.com/eve0415/oasts"
description = "OpenAPI-to-TypeScript compiler with fully typed errors, compile-time auth checks, and a zero-dependency fetch client — plus first-party Zod, TanStack Query, and MSW artifacts."
keywords = ["openapi", "typescript", "codegen", "compiler"]
categories = ["command-line-utilities", "development-tools"]
