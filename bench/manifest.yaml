# bench/manifest.yaml — frozen entry-gate benchmark manifest.
# Every field in this file is frozen: the harness reads it and appends results to bench/results.yaml only.
# Changing any field after a measurement exists requires a recorded decision and a clean rerun.
schemaVersion: 1
runners:
  reference: # CI gate runner; activates when GitHub Actions workflows land
    kind: github-actions
    image: ubuntu-24.04
  baseline: # local measurement environment for pre-CI baselines
    kind: devcontainer
    image: mcr.microsoft.com/devcontainers/rust:2.0.14-trixie
toolchain:
  rust: "1.97.1"
  node: "24.18.1"
  pnpm: "11.18.0"
  typescript: "7.0.2"
typescriptVersions: # the pinned TS version set; minimum/floor 7.0
  - "7.0.2"
commands:
  generate: "target/release/oasts generate --config <configFile>" # cwd = the copied fixture directory
  tsc: "pnpm exec tsc --strict --noEmit --skipLibCheck false --target es2022 --module esnext --moduleResolution bundler <emitted .ts files>"
procedure:
  cold: "first generate invocation of a fresh process on a freshly copied fixture directory, no prior invocation of that key in the harness session; recorded, not gated"
  warm: "a generate process invocation of a key after warmupRuns completed invocations of the same key in the same harness session (OS page cache warm); process spawn and exit included in the timed window"
  warmupRuns: 3
  samples: 10
  rounds: 2 # two full sample sets back-to-back per key
  percentile: nearest-rank # p50 over n ascending samples = value at 1-based index ceil(0.50 * n)
  repeatabilityBound: 0.10 # |p50_r1 - p50_r2| / min(p50_r1, p50_r2) <= bound; the gated value is max(p50_r1, p50_r2)
  rssMethod: wait4-rusage # child peak RSS = ru_maxrss from wait4(2) on the generate process
thresholds:
  warmGenerateP50Ms:
    "github-3.0/oasts.yaml": 1000 # warm types-only generation of the pinned GitHub fixture < 1 s at p50
  rssCeilingBytes:
    large: 2147483648 # 2 GiB
    small: 536870912 # 512 MiB
  tscCeilingMs:
    large: 300000
    small: 60000
fixtures:
  - name: github-3.0
    class: large
    config: oasts.yaml
    spec:
      path: openapi.json
      url: "https://raw.githubusercontent.com/github/rest-api-description/v2.1.0/descriptions/api.github.com/api.github.com.json"
      sha256: "b138e9cdcf4ac29a23fea1f6579d2840668a5f3d41fe7f160b263bec590d2e3f"
  - name: stripe-3.0
    class: large
    config: oasts.yaml
    spec:
      path: openapi.json
      url: "https://raw.githubusercontent.com/stripe/openapi/v2344/openapi/spec3.json"
      sha256: "e24a26de4188fd64dec4c043d5d3726277fdcb07556a493ea481c305b0a223d8"
  - name: cloudflare-3.0
